[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "soarm-lab"
version = "0.1.0"
description = "SO-101 training: RL tasks, CPU and GPU environments, PPO and the policies, on a station exported by the digital twin"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
# Running a policy (the strategy, evaluation, the CPU environments) needs numpy only: no jax, no torch.
dependencies = [
    "soarm",
    # The twin's plugin contracts (numpy only); never the twin itself.
    "machinekind-twin-api>=0.1,<0.2",
    "numpy>=1.24",
    "PyYAML>=6.0",
    "mujoco>=3.14,<3.15",
    "gymnasium>=1.0",
]

[project.optional-dependencies]
# GPU training (`soarm-lab train`): the JAX PPO trainer (rl/ppo.py) on thousands of MuJoCo Warp worlds
# (rl/batch.py), no torch. mujoco and mujoco-warp must have the same version. On Linux jax comes with its
# CUDA 12 build (x86_64 and aarch64 wheels); elsewhere it is the CPU build, enough for the tests.
# jax 0.6 is the floor for the DLPack import and the typed random keys rl/batch.py uses.
train = [
    "mujoco-warp>=3.14,<3.15",
    "jax>=0.6",
    "jax[cuda12]>=0.6; sys_platform == 'linux'",
    "optax>=0.2",
]
# The converter of old torch checkpoints (`soarm-lab convert`, rl/torch_policy.py) only: it turns a
# policy.pt into policy.npz. Training and running a policy need no torch.
torch = ["torch>=2.7,<2.12"]
# Dream Labs: the `dream` strategy and `soarm-lab dream`, the Dream-1 model over the network. The `dreamlabs` library
# brings the client and dream's IK (`dream_ik`), which an SO-101 needs; it supports Python 3.11 to 3.13.
# soarm[feetech] (pyserial) is for `soarm-lab dream arm`. In the workspace: uv sync --extra dream
dream = [
    "dreamlabs>=1.0.5,<2; python_version >= '3.11' and python_version < '3.14'",
    "soarm[feetech]",
]

[project.entry-points."machinekind_twin.strategies"]
policy = "soarm_lab.strategies.policy:PolicyStrategy"
ik = "soarm_lab.strategies.ik:IKStrategy"
dream = "soarm_lab.strategies.dream:DreamStrategy"
touch = "soarm_lab.strategies.touch:TouchStrategy"
touch_jev = "soarm_lab.strategies.touch_jev:JevTouchStrategy"
grasp = "soarm_lab.strategies.grasp:GraspStrategy"

[project.scripts]
soarm-lab = "soarm_lab.cli:main"

[tool.uv.sources]
soarm = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["soarm_lab"]
