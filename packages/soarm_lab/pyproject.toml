[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "soarm-lab"
version = "0.1.0"
description = "SO-101 training: RL tasks, CPU and GPU environments, PPO and the policies, on a station exported by the digital twin"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "soarm",
    "numpy>=1.24",
    "PyYAML>=6.0",
    "mujoco>=3.14,<3.15",
    "gymnasium>=1.0",
    # CPU is enough for the environments, evaluation and the strategy; GPU training needs a CUDA build.
    "torch>=2.7,<2.12",
]

[project.optional-dependencies]
# GPU training: thousands of MuJoCo Warp worlds. mujoco and mujoco-warp must have the same version.
train = ["mujoco-warp>=3.14,<3.15"]

[project.entry-points."lerobot_mp.strategies"]
policy = "soarm_lab.strategy:PolicyStrategy"

[project.scripts]
soarm-lab = "soarm_lab.cli:main"

[tool.uv.sources]
soarm = { workspace = true }

[tool.hatch.build]
# The bundled policies' weights. Hatchling reads the repository's .gitignore (*.pt) relative to this
# folder, where its exception for these files does not match; artifacts put them in the sdist and the wheel.
artifacts = ["soarm_lab/policies/*/policy.pt"]

[tool.hatch.build.targets.wheel]
packages = ["soarm_lab"]
