[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "soarm-lab"
version = "0.1.0"
description = "Everything learned or measured for the SO-101 demo: rig, perception, training, evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["soarm"]

[project.optional-dependencies]
twin = ["lerobot-mp @ git+https://github.com/machinekind/digital_twin_training.git@main"]
train = ["torch>=2.7,<2.12", "mujoco>=3.14,<3.15", "mujoco-warp>=3.14,<3.15"]

[tool.uv.sources]
soarm = { workspace = true }

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["soarm_lab"]
