# One physical arm. Copy this folder to arms/<arm-id>/ and replace every TODO with a measured value.
id: example
robot: so101                      # folder name in robot/
role: follower                    # follower | leader
serial_number: TODO               # USB adapter serial, from `soarm scan` or the OS device list
port: TODO                        # e.g. /dev/ttyACM0, /dev/cu.usbmodem58FA0958121, COM5
lerobot_robot_id: so101_follower  # selects the LeRobot calibration file
mount: table                      # folder name in mounts/

# Ticks are raw servo positions, 0..4095 per turn.
center_ticks: 2048
gripper_closed_ticks: 1986        # value of the twin's example arm; measure yours
gripper_open_ticks: 2670          # value of the twin's example arm; measure yours

# Min/Max angle limits stored in each servo's EEPROM [ticks]. The servo clips every command to them.
eeprom_limits:                    # TODO: read with `soarm limits`
  shoulder_pan: [TODO, TODO]
  shoulder_lift: [TODO, TODO]
  elbow_flex: [TODO, TODO]
  wrist_flex: [TODO, TODO]
  wrist_roll: [TODO, TODO]
  gripper: [TODO, TODO]

calibration: calibration.json     # LeRobot calibration file in this folder, or null
sysid: sysid/dynamics.json        # fitted dynamics in this folder, or null
