# SO-101 (LeRobot SO-ARM101) with the stock gripper.
#
# Sources, copied value by value from the twin (digital_twin_training):
#   - the `SO101 = RobotSpec(...)` constant in src/lerobot_mp/twin/robots.py
#   - the `robot:` section of configs/default.yaml (the `hardware:` block below)
# Fields the SO101 constant leaves at their defaults are written out with those default values.
# The twin's defaults for `jaw` and `desk` are the SO-101 values.
#
# Units: joints in degrees, gripper 0..100 (0 closed, 100 open).
# `jaw` is in MJCF units of the gripper joint (radians here). `desk` is in metres and radians.
# Schema: docs/conventions.md. Per-arm values (port, serial, calibration) live in arms/<id>/arm.yaml.

status: ready
name: so101
title: SO-101 (LeRobot)
mjcf: so101.xml
joints: [shoulder_pan, shoulder_lift, elbow_flex, wrist_flex, wrist_roll, gripper]
gripper: gripper
tcp_site: gripperframe
hand_body: gripper
base_body: base
backend: soarm.feetech:FeetechArm

home:
  shoulder_pan: 0.0
  shoulder_lift: -23.3
  elbow_flex: 46.4
  wrist_flex: 3.3
  wrist_roll: 0.0
  gripper: 35.0

tcp_approach: [1.0, 0.0, 0.0]
tcp_closing: [0.0, 0.0, 1.0]
fingertips: [fixed_jaw_sph_tip1, moving_jaw_sph_tip1]
roll_joint: wrist_roll

wave_ranges:
  shoulder_pan: [-75.0, 75.0]
  shoulder_lift: [-80.0, 30.0]
  elbow_flex: [-30.0, 90.0]
  wrist_flex: [-70.0, 80.0]

onboard_cameras: [wrist_cam]
jaw_bodies: [gripper, moving_jaw_so101_v1]

limits:
  shoulder_pan: [-105.0, 105.0]
  shoulder_lift: [-95.0, 95.0]
  elbow_flex: [-92.0, 92.0]
  wrist_flex: [-95.0, 95.0]
  wrist_roll: [-150.0, 150.0]
  gripper: [0.0, 100.0]

max_vel:
  shoulder_pan: 140.0
  shoulder_lift: 120.0
  elbow_flex: 120.0
  wrist_flex: 160.0
  wrist_roll: 220.0
  gripper: 300.0

# null: the gripper maps 0..100 through the servo ticks in `hardware`.
gripper_range_q: null
mirror_joints: {}
home_stages: []

jaw:
  still: 0.02
  margin: 0.05
  creep: 0.03
  open: 0.40

desk:
  goal_radius: [0.13, 0.32]
  goal_height: [0.03, 0.22]
  cube_radius: [0.15, 0.25]
  cube_bearing: [-0.8, 0.8]
  wave_radius: [0.12, 0.36]
  search_centre: [0.2, 0.0, 0.05]
  search_dist: [0.4, 0.9]
  camera_dist: [0.45, 0.75]
  camera_centre: [0.20, 0.0, 0.06]
  map_centre: [0.22, 0.0]
  map_side: 0.56

hardware:
  kind: so101
  # Servo IDs count from the base to the gripper (twin robot/feetech.py DEFAULT_IDS).
  servo_ids:
    shoulder_pan: 1
    shoulder_lift: 2
    elbow_flex: 3
    wrist_flex: 4
    wrist_roll: 5
    gripper: 6
  baudrate: 1000000
  center_ticks: 2048
  gripper_closed_ticks: 1986
  gripper_open_ticks: 2670
  use_degrees: true
  max_relative_target: 12.0
  read_state_hz: 10.0
  # A limp arm drops under its own weight. Turn this on only when the arm is supported.
  torque_off_on_exit: false
