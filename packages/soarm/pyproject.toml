[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "soarm"
version = "0.1.0"
description = "SO-101 robot: robot folders, robot.yaml loader and Feetech hardware backends"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
feetech = ["pyserial>=3.5"]
lerobot = ["lerobot[feetech]>=0.6,<0.7; python_version>='3.12'"]
dev = ["pytest", "ruff"]

[project.scripts]
soarm = "soarm.cli:main"

[project.entry-points."lerobot_mp.robots"]
so101 = "soarm.spec:so101"

[project.entry-points."lerobot_mp.backends"]
feetech = "soarm.feetech:FeetechArm"
bridge = "soarm.bridge:BridgeArm"
lerobot = "soarm.lerobot:LeRobotArm"

[tool.hatch.build.targets.wheel]
packages = ["soarm"]

[tool.hatch.build.targets.wheel.force-include]
"robot" = "soarm/robot"
"end_effectors" = "soarm/end_effectors"
"mounts" = "soarm/mounts"
"embodiment" = "soarm/embodiment"

[tool.hatch.build.targets.sdist]
include = ["soarm", "robot", "end_effectors", "mounts", "embodiment", "arms", "README.md"]
