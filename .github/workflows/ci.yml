name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Install default environment
        run: uv sync --locked
      - name: Check default dependency boundary
        run: |
          uv run --no-sync python - <<'PY'
          import importlib.util
          for module in ("torch", "machinekind_twin"):
              assert importlib.util.find_spec(module) is None, f"Default install includes {module}"
          PY
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Types
        run: uv run --no-sync pyright
      - name: Test
        run: uv run --no-sync pytest
      - name: Build distributions and verify license contents
        run: |
          uv build --all-packages
          uv run --no-sync python - <<'PY'
          from email.parser import Parser
          from pathlib import Path
          import tarfile
          import tomllib
          import zipfile

          for package in ("soarm", "soarm_lab"):
              source = Path("packages") / package
              project = tomllib.loads((source / "pyproject.toml").read_text())["project"]
              stem = f"{package}-{project['version']}"
              required = ["LICENSE", "NOTICE"]
              if package == "soarm":
                  required += ["THIRD_PARTY_NOTICES", "soarm/robot/LICENSE"]
              for name in ("LICENSE", "NOTICE"):
                  assert (source / name).read_bytes() == Path(name).read_bytes(), (package, name)
              with zipfile.ZipFile(Path("dist") / f"{stem}-py3-none-any.whl") as wheel:
                  metadata = Parser().parsestr(wheel.read(f"{stem}.dist-info/METADATA").decode())
                  assert metadata["License-Expression"] == "Apache-2.0", package
                  assert set(metadata.get_all("License-File", [])) >= set(required), package
                  for name in required:
                      assert wheel.read(f"{stem}.dist-info/licenses/{name}") == (source / name).read_bytes()
              with tarfile.open(Path("dist") / f"{stem}.tar.gz") as sdist:
                  for name in required:
                      assert sdist.extractfile(f"{stem}/{name}").read() == (source / name).read_bytes()
              print(f"Verified license contents: {package} wheel and sdist")
          PY

  integration:
    # macOS PyTorch wheels have no CUDA dependencies; these tests run on CPU.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Install twin and torch
        run: uv sync --locked --group twin --group torch
      - name: Test optional integrations
        run: uv run --no-sync pytest
