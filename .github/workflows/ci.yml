name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked --all-groups
      - name: Lint
        run: uv run ruff check .
      - name: Types
        run: uv run pyright
      - name: Test
        run: uv run pytest
