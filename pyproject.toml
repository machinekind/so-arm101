[tool.uv.workspace]
members = ["packages/soarm"]

[tool.uv.sources]
soarm = { workspace = true }

[dependency-groups]
dev = [
    "soarm[feetech]",
    # The twin, for the tests that run our robot folder and backends through its contract.
    "lerobot-mp @ git+https://github.com/machinekind/digital_twin_training.git@main",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["soarm", "conftest"]

[tool.ruff.lint.per-file-ignores]
# Moved from the twin, which lints with ruff's default rules only; kept as they were there.
"packages/soarm/soarm/feetech.py" = ["E501"]
"packages/soarm/soarm/lerobot_backend.py" = ["E501"]
"packages/soarm/soarm/settings.py" = ["B905"]
"tests/test_feetech.py" = ["E501"]
"tests/test_lerobot_backend_guard.py" = ["E501"]
