[tool.uv.workspace]
members = ["packages/soarm", "packages/soarm_lab"]

[tool.uv.sources]
soarm = { workspace = true }
soarm-lab = { workspace = true }
# The plugin contracts (`machinekind_twin_api`) come from packages/machinekind_twin_api
# in the public twin repository; they are not on PyPI.
# The twin comes from the same commit, because it depends on that package too,
# and so do the twin's example cube detector (examples/detectors/cube)
# and its LLM detector (packages/machinekind_twin_llm).
machinekind-twin-api = { git = "https://github.com/machinekind/twin.git", subdirectory = "packages/machinekind_twin_api", rev = "b1d606d4646c0df7146fb2d22656be00ec6fcc46" }
machinekind-twin = { git = "https://github.com/machinekind/twin.git", rev = "b1d606d4646c0df7146fb2d22656be00ec6fcc46" }
machinekind-twin-cube = { git = "https://github.com/machinekind/twin.git", subdirectory = "examples/detectors/cube", rev = "b1d606d4646c0df7146fb2d22656be00ec6fcc46" }
machinekind-twin-llm = { git = "https://github.com/machinekind/twin.git", subdirectory = "packages/machinekind_twin_llm", rev = "b1d606d4646c0df7146fb2d22656be00ec6fcc46" }

# dreamlabs (the `dream` extra of soarm-lab) pins jax to 0.7.1. The JAX trainer's extra (`train`) keeps its
# own jax and optax: the two extras are resolved apart and never install together.
[tool.uv]
conflicts = [[{ package = "soarm-lab", extra = "dream" }, { package = "soarm-lab", extra = "train" }]]

[dependency-groups]
# `uv sync`: the arm and the lab, with pytest, ruff and pyright. No torch, no twin.
dev = [
    "soarm[feetech,panel]",
    "soarm-lab",
    "pytest>=8",
    "ruff>=0.6",
    "pyright>=1.1",
]
# `uv sync --group torch`: torch for `soarm-lab convert`, which turns an old torch checkpoint (policy.pt)
# into policy.npz, and its tests (packages/soarm_lab/tests/rl/test_policy_format.py). Training needs no torch.
torch = ["soarm-lab[torch]"]
# `uv sync --group twin`: the twin, for the tests marked `twin` that run both packages through its own code,
# its example cube detector, which the lift test sees the cube with, and its LLM detector, which places
# objects coarsely, seconds late, from a language model's answers.
# The application stays optional; the base packages depend only on its API.
twin = ["machinekind-twin", "machinekind-twin-cube", "machinekind-twin-llm"]

# Type-check the twin contract implementations, grasp library, planner, campaign records, the approach table
# and test panel.
[tool.pyright]
include = ["packages/soarm_lab/soarm_lab/strategies", "packages/soarm_lab/soarm_lab/grasp_library.py",
           "packages/soarm_lab/soarm_lab/planner", "packages/soarm_lab/soarm_lab/campaign.py",
           "packages/soarm_lab/soarm_lab/approach_table.py", "packages/soarm/soarm/panel.py"]

[tool.pytest.ini_options]
testpaths = ["packages/soarm/tests", "packages/soarm_lab/tests"]
# importlib: same-named test modules in the two packages (test_entry_points.py, conftest.py) do not collide.
addopts = ["--import-mode=importlib"]
# For the test helpers fake_bus.py and twin_stand.py.
pythonpath = ["packages/soarm/tests", "packages/soarm_lab/tests/strategies"]
markers = [
    "twin: needs the digital twin (machinekind_twin) installed; skipped otherwise",
    "render: renders frames through MuJoCo/OpenGL; skipped where no OpenGL context can be made",
    "campaign: a seeded simulation campaign; jobs/overnight.sh runs these at scale and keeps every run",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["soarm", "soarm_lab", "fake_bus"]

[tool.ruff.lint.per-file-ignores]
# Long lines and zip() without strict= in these modules are kept as written.
"packages/soarm/soarm/feetech.py" = ["E501"]
"packages/soarm/soarm/lerobot_backend.py" = ["E501"]
"packages/soarm/soarm/settings.py" = ["B905"]
"packages/soarm/tests/test_feetech.py" = ["E501"]
"packages/soarm/tests/test_lerobot_backend.py" = ["E501"]
"packages/soarm_lab/tests/rl/test_policies.py" = ["E501"]
"packages/soarm_lab/tests/rl/test_env.py" = ["E501", "B905"]
"packages/soarm_lab/soarm_lab/rl/*.py" = ["E501", "B905"]
"packages/soarm_lab/soarm_lab/cli.py" = ["E501"]
