[tool.uv.workspace]
members = ["packages/soarm", "packages/soarm_lab"]

[tool.uv.sources]
soarm = { workspace = true }
soarm-lab = { workspace = true }

[dependency-groups]
dev = [
    "soarm[feetech]",
    # torch for the tests of the legacy torch trainer and the converter; the runtime needs none
    # (packages/soarm_lab/tests/test_dependency_rule.py).
    "soarm-lab[torch]",
    # The twin, for the tests marked `twin` that run both packages through its own code.
    "lerobot-mp @ git+https://github.com/machinekind/digital_twin_training.git@main",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["packages/soarm/tests", "packages/soarm_lab/tests"]
# importlib: same-named test modules in the two packages (test_entry_points.py, conftest.py) do not collide.
addopts = ["--import-mode=importlib"]
# For the test helper fake_bus.py.
pythonpath = ["packages/soarm/tests"]
markers = [
    "twin: needs the digital twin (lerobot_mp) installed; skipped otherwise",
    "render: renders frames through MuJoCo/OpenGL; skipped where no OpenGL context can be made",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["soarm", "soarm_lab", "fake_bus"]

[tool.ruff.lint.per-file-ignores]
# Long lines and zip() without strict= in these modules are kept as written.
"packages/soarm/soarm/feetech.py" = ["E501"]
"packages/soarm/soarm/lerobot_backend.py" = ["E501"]
"packages/soarm/soarm/settings.py" = ["B905"]
"packages/soarm/tests/test_feetech.py" = ["E501"]
"packages/soarm/tests/test_lerobot_backend.py" = ["E501"]
"packages/soarm_lab/tests/rl/test_policies.py" = ["E501"]
"packages/soarm_lab/tests/rl/test_env.py" = ["E501", "B905"]
"packages/soarm_lab/soarm_lab/rl/*.py" = ["E501", "B905"]
"packages/soarm_lab/soarm_lab/cli.py" = ["E501"]
