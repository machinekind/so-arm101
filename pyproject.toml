[tool.uv.workspace]
members = ["packages/soarm", "packages/soarm_lab"]

[tool.uv.sources]
soarm = { workspace = true }
soarm-lab = { workspace = true }

[dependency-groups]
dev = [
    "soarm",
    "soarm-lab",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["soarm", "soarm_lab", "conftest"]
