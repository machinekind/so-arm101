# Hand-written cube poses in isaac_grasp format, with (w, xyz) quaternions.
# The aligned gripper frame has +Z approach and +X closing at the URDF root.
# The block frame is centred on the cube with z up.
# Position is P - R @ pad, with R columns closing, approach × closing, approach.
# P is the pad point and pad is sweep_volume.offset from so101/config.json.
# Scores are deliberately unordered to test sorting during conversion.
# test_grasp_library.py checks conversion against the bundled cube.json.
format: isaac_grasp
format_version: 1.0
grasps:
  # Top-down, closing +y, centred.
  grasp_0:
    confidence: 0.92
    position: [0.0, -0.0344, 0.0736]
    orientation: {w: 0.0, xyz: [0.70710678, 0.70710678, 0.0]}
  # Top-down, closing -y, centred.
  grasp_1:
    confidence: 0.91
    position: [0.0, 0.0344, 0.0736]
    orientation: {w: 0.0, xyz: [-0.70710678, 0.70710678, 0.0]}
  # Top-down, closing +x, centred.
  grasp_2:
    confidence: 0.90
    position: [-0.0344, 0.0, 0.0736]
    orientation: {w: 0.0, xyz: [1.0, 0.0, 0.0]}
  # Top-down, closing -x, centred.
  grasp_3:
    confidence: 0.89
    position: [0.0344, 0.0, 0.0736]
    orientation: {w: 0.0, xyz: [0.0, 1.0, 0.0]}
  # Top-down with diagonal closing along (+x+y)/sqrt(2).
  grasp_4:
    confidence: 0.55
    position: [-0.024324, -0.024324, 0.0736]
    orientation: {w: 0.0, xyz: [0.92387953, 0.38268343, 0.0]}
  # From the side: approach -x, closing +y, centred.
  grasp_5:
    confidence: 0.80
    position: [0.0736, -0.0344, 0.0]
    orientation: {w: 0.5, xyz: [-0.5, -0.5, 0.5]}
  # Top-down, closing +y, with the pad point below centre.
  grasp_6:
    confidence: 0.70
    position: [0.0, -0.0344, 0.0631]
    orientation: {w: 0.0, xyz: [0.70710678, 0.70710678, 0.0]}
  # Top-down, closing +y, with a shallow pad point offset along +x.
  grasp_7:
    confidence: 0.85
    position: [0.005, -0.0344, 0.0821]
    orientation: {w: 0.0, xyz: [0.70710678, 0.70710678, 0.0]}
